name: CI

# Python engine tests (parity with the frozen legacy engine, portfolio, scanner,
# research pipeline) + the JS engine's exact-parity tests. No network needed.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -r requirements-core.txt
      - name: Python tests
        run: python -m unittest discover -s tests -t . -v
      - name: JS engine tests (exact parity with Python)
        run: node --test pwa/tests/*.test.mjs
      - name: Demo site builds
        run: python publish.py --out site --demo --state /tmp/demo_state.json
